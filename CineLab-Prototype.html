<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0606" />
<meta name="description" content="片刻 CineLab：探索电影、记录喜好与推荐算法实验。" />
<title>片刻 CineLab · 红黑高级原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   红黑高级主题：深黑底 + 高级红 + 象牙白；统一字体层级/卡片/悬停
   =================================================================== */
:root,html.dark{
  color-scheme:dark;
  --bg:#0a0606;                              /* 近黑（带暖红） */
  --bg-2:#120a0a;
  --surface:#160d0d;                          /* 深红炭 */
  --surface-2:#1d1212;
  --text:#f4ecea;                             /* 象牙白 */
  --muted:#a2908c;                            /* 暖灰 */
  --border:#2c1a1a;                           /* 红棕描边 */
  --accent:#e11d2a;                           /* 高级红（克制醒目） */
  --accent-d:#9e1320;                         /* 深红（渐变/阴影） */
  --accent-tint:#e11d2a14;
  --ink:#1a0608;                              /* 红底深字 */
  --danger:#e5736b;
  --glass:rgba(20,12,12,.6);
  --glass-brd:rgba(255,235,235,.08);          /* 暖白发丝边框 */
  --el-color-primary:#e11d2a;
  --el-font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-display:"Noto Serif SC",Georgia,"Songti SC",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--text); font:15px/1.65 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(900px 620px at 88% -8%, rgba(225,29,42,.18), transparent 58%),
    radial-gradient(820px 560px at 6% 100%, rgba(225,29,42,.08), transparent 60%),
    linear-gradient(180deg,#0c0707,#0a0606 45%,#080404);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button,a,input,select{ -webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button:enabled,a,[role=button]{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:600;line-height:1.3;letter-spacing:-.02em}
h1{font-size:clamp(34px,4.4vw,56px)}
h2{font-size:26px}
h3{font-size:18px}
small{font-size:12px}
strong{font-weight:600}
.muted{color:var(--muted)}
.small-label,.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:600;color:var(--muted)}
.eyebrow{margin-bottom:16px;color:var(--accent)}
.heading-dot{color:var(--accent)}
.hero h1,.section-heading h2,.page-heading h1,.detail-content h1,.auth-intro h1,.profile-heading h1,.not-found h1,.ticket-caption,.cinema-hero h1{font-family:var(--font-display);letter-spacing:-.01em}

/* ====================== 布局：固定侧栏 + 主区 ====================== */
.layout{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;padding:30px 22px;display:flex;flex-direction:column;gap:6px;
  border-right:1px solid var(--border);background:rgba(9,6,6,.72);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);z-index:50;
  transition:box-shadow .3s}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:650;white-space:nowrap;padding:4px 6px}
.brand-en{font-size:10px;letter-spacing:.16em;display:block;line-height:1.1;color:var(--muted);margin-top:2px}
.brand-mark{width:38px;height:42px;border:1px solid var(--accent);border-radius:11px;display:grid;place-items:center;font-size:17px;color:var(--accent);padding-left:3px;box-shadow:0 0 22px -6px var(--accent)}
.sidebar nav{display:flex;flex-direction:column;gap:4px;margin-top:34px}
.sidebar nav a{display:flex;align-items:center;gap:12px;color:var(--muted);padding:13px 16px;border-radius:12px;font-size:15px;font-weight:500;transition:background .2s,color .2s,transform .2s}
.sidebar nav a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.sidebar nav a.active{color:var(--text);background:var(--accent-tint);box-shadow:inset 3px 0 0 var(--accent)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-left:auto}
.side-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--border)}
.account-nav{display:flex;flex-direction:column;gap:10px}
.account-link{display:flex;align-items:center;gap:10px;min-height:40px;color:var(--text)}
.account-link span{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login-link{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:500}
.main{margin-left:250px;flex:1;min-width:0;display:flex;flex-direction:column}
.page{max-width:1280px;width:100%;margin:0 auto;padding:46px 48px 70px;flex:1}
.home-page{padding-top:30px}

/* ====================== 按钮 ====================== */
.button,.btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 22px;border-radius:12px;border:1px solid var(--border);font-weight:600;font-size:14px;transition:transform .2s,background .2s,color .2s,border-color .2s,box-shadow .2s}
.button.primary,.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#fff;box-shadow:0 14px 34px -14px rgba(225,29,42,.8)}
.button.primary:hover,.btn.primary:hover{transform:translateY(-2px);box-shadow:0 18px 42px -14px rgba(225,29,42,.9)}
.button.subtle,.btn:hover{background:rgba(255,255,255,.05);color:var(--text);border-color:var(--glass-brd)}
.button.subtle:hover{border-color:var(--accent)}
.text-link{color:var(--accent);font-size:13px;display:inline-flex;align-items:center;gap:8px;min-height:32px;transition:gap .2s}
.text-link:hover{text-decoration:underline;gap:11px}

/* ====================== 首页：宽幅电影主视觉 ====================== */
.cinema-hero{position:relative;min-height:76vh;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:46px;padding:64px 60px;border-radius:26px;overflow:hidden;
  border:1px solid var(--glass-brd);
  background:
    radial-gradient(120% 110% at 82% 8%, rgba(225,29,42,.34), transparent 52%),
    radial-gradient(70% 80% at 0% 100%, rgba(225,29,42,.10), transparent 60%),
    linear-gradient(135deg,#190b0b,#0a0606 72%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 50px 120px -60px rgba(0,0,0,.95);}
.cinema-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 85% 12%,rgba(225,29,42,.18),transparent 60%);pointer-events:none}
.cinema-hero .eyebrow{display:flex;align-items:center;gap:10px}
.cinema-hero .eyebrow>span{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.cinema-hero h1{font-size:clamp(46px,6vw,84px);line-height:1.08;font-weight:700}
.cinema-hero h1 span{color:var(--accent);text-shadow:0 0 40px rgba(225,29,42,.5)}
.cinema-hero .hero-description{color:var(--muted);line-height:1.95;font-size:16px;margin-top:6px}
.hero-actions{display:flex;gap:16px;margin-top:30px;flex-wrap:wrap}
.hero-footnote{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.22em;color:var(--muted);margin-top:34px}
.hero-footnote .line{width:34px;height:1px;background:var(--muted)}
.hero-stage{position:relative;height:420px;display:flex;align-items:center;justify-content:center}
.hero-stage .orbital{position:absolute;border:1px solid rgba(225,29,42,.25);border-radius:50%;width:360px;height:360px;transform:rotate(-28deg);animation:spin 30s linear infinite}
.hero-stage .featured{position:relative;z-index:2;width:280px;border-radius:18px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 1px rgba(225,29,42,.4);transform:rotate(-3deg);transition:transform .5s}
.hero-stage .featured:hover{transform:rotate(0) scale(1.03)}
.hero-stage .feat-tag{position:absolute;top:14px;left:14px;z-index:3;font-size:10px;letter-spacing:.2em;font-weight:700;color:#fff;background:var(--accent);padding:5px 11px;border-radius:99px;box-shadow:0 8px 20px -8px rgba(225,29,42,.9)}
.feat-poster{aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 70% 0%,#5a1c20,#2a0d10 70%);color:#e9c2c2;text-align:center;padding:18px}
.feat-poster .fp-title{font-family:var(--font-display);font-size:30px;font-weight:700;color:#fff;line-height:1.2}
.feat-poster .fp-en{font-size:12px;opacity:.7;font-style:italic}
.feat-poster .fp-rate{margin-top:8px;font-size:13px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:99px}
@keyframes spin{to{transform:rotate(332deg)}}
.film-ticket{position:absolute;bottom:-6px;right:6px;z-index:3;width:170px;background:linear-gradient(160deg,#7e1722,#5a0f17);color:#f6e9ea;border-radius:12px;transform:rotate(7deg);box-shadow:14px 16px 0 #0a0606aa,0 24px 50px -20px rgba(0,0,0,.8);padding:14px 16px;transition:transform .5s}
.film-ticket:hover{transform:rotate(1deg) scale(1.05)}
.ticket-top,.ticket-bottom{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.14em;font-weight:600;opacity:.85}
.ticket-reel{position:relative;width:64px;height:64px;border:2px solid #f6e9ea;border-radius:50%;margin:12px auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px}
.ticket-reel span{border:1.5px solid #f6e9ea;border-radius:50%}
.ticket-reel i{position:absolute;border-radius:50%;background:#f6e9ea;width:6px;height:6px;left:27px;top:27px}
.ticket-caption{font-size:20px;line-height:1.1;letter-spacing:-.03em;font-weight:600}
.ticket-caption em{font-family:Georgia,serif;font-weight:400;font-size:26px}
.ticket-bottom{padding-top:10px;margin-top:10px;border-top:1px dashed rgba(246,233,234,.4);font-size:8px;display:flex;justify-content:space-between}

/* ====================== intro 条 ====================== */
.intro-strip{display:flex;align-items:center;gap:30px;justify-content:space-between;padding:26px 4px;border-bottom:1px solid var(--border);font-size:12px;margin-top:8px}
.intro-strip p{display:flex;align-items:center;gap:12px}
.intro-strip .ic{color:var(--accent);font-size:18px}
.intro-strip p span{color:var(--muted)}
.intro-strip>a{color:var(--accent);white-space:nowrap}

/* ====================== 区块标题 / 推荐 ====================== */
.browse-section,.recommendation-section{margin-top:54px}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}
.section-heading .eyebrow{margin-bottom:8px}
.section-heading .muted{font-size:13px;margin-top:10px}
.recommendation-columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.algorithm-panel,.history-panel,.evaluation-panel,.auth-card,.rating-panel,.filter-bar{
  border:1px solid var(--glass-brd);background:var(--glass);border-radius:16px;overflow:hidden;
  backdrop-filter:blur(12px) saturate(120%);-webkit-backdrop-filter:blur(12px) saturate(120%);
  box-shadow:0 24px 60px -34px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05);}
.section-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-top h2,.section-top h3{font-size:16px}
.section-top .small-label{font-size:9px}
.algorithm-empty{padding:32px 24px;display:flex;align-items:start;gap:20px;flex-wrap:wrap}
.algorithm-symbol{width:46px;height:46px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent);border:1px solid rgba(225,29,42,.3);border-radius:10px;font-size:23px}
.algorithm-empty>div:nth-child(2){flex:1;min-width:180px}
.status-pill{font-size:10px;background:var(--accent-tint);color:var(--accent);padding:4px 10px;border-radius:7px;border:1px solid rgba(225,29,42,.3);display:inline-block;letter-spacing:.04em;font-weight:600}
.algorithm-empty h3{font-size:16px;margin-top:15px}
.algorithm-empty p{font-size:12px;color:var(--muted);margin-top:8px;max-width:37em}
.algorithm-empty .text-link{margin-left:64px}
.recommendation-results{padding:24px}
.recommendation-results li{padding:8px;border-bottom:1px solid var(--border)}
.recommendation-results li a{color:var(--accent)}

/* ====================== 横向货架 / 卡片（统一） ====================== */
.movie-shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(195px,1fr);gap:20px;overflow-x:auto;padding:6px 2px 18px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.movie-shelf>*{scroll-snap-align:start;min-width:0}
.movie-shelf::-webkit-scrollbar{height:8px}.movie-shelf::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.movie-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 24px}
.movie-card{min-width:0}
.poster-wrap{position:relative;border-radius:14px;overflow:hidden;background:var(--surface)}
.movie-poster{width:100%;aspect-ratio:3/3.8;overflow:hidden;background:var(--surface);border-radius:14px;border:1px solid var(--border);transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .2s}
.movie-card a{display:block}
.movie-card{transition:transform .35s cubic-bezier(.22,1,.36,1)}
.movie-card:hover{transform:translateY(-8px)}
.movie-card:hover .movie-poster{border-color:var(--accent);box-shadow:0 26px 50px -22px rgba(0,0,0,.85),0 0 0 1px rgba(225,29,42,.5),0 0 30px -6px rgba(225,29,42,.45)}
.movie-card:hover .poster-img{transform:scale(1.07)}
.poster-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s}
.poster-placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at 70% 0%,#4a171b66,transparent 70%),linear-gradient(145deg,#241214,#1a0d0f);color:#c79a9e;gap:10px}
.poster-placeholder .ph-ic{font-size:46px;opacity:.7}
.poster-placeholder>span:not(.frame-corner){font-size:12px;letter-spacing:.1em}
.poster-placeholder small{font-size:8px;letter-spacing:.22em;color:#a9797d}
.frame-corner{position:absolute;width:23px;height:23px;border-color:#b97e8266;border-style:solid}
.frame-corner.top{top:22px;left:22px;border-width:1px 0 0 1px}
.frame-corner.bottom{bottom:22px;right:22px;border-width:0 1px 1px 0}
.shine{position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s;pointer-events:none}
.movie-card:hover .shine{transform:translateX(120%)}
.movie-id{position:absolute;top:12px;left:12px;background:rgba(10,6,6,.65);border:1px solid rgba(255,255,255,.18);border-radius:7px;font-size:10px;padding:3px 8px;color:#e7d6d6;font-family:monospace;backdrop-filter:blur(4px)}
.my-rating{position:absolute;bottom:10px;left:10px;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700;box-shadow:0 6px 16px -6px rgba(225,29,42,.8)}
.card-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:16px;opacity:0;transform:translateY(12px);
  background:linear-gradient(to top,rgba(8,4,4,.96) 8%,rgba(8,4,4,.5) 48%,transparent 78%);transition:opacity .35s,transform .35s}
.movie-card:hover .card-overlay,.movie-card a:focus-visible .card-overlay{opacity:1;transform:none}
.card-title{font-size:14px;font-weight:600;color:#fff;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:11px;color:#e8c9cc}.card-meta span{opacity:.6}
.card-cta{margin-top:6px;width:fit-content;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px}
.movie-card h3{font-size:15px;margin-top:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:color .2s}
.movie-card:hover h3{color:var(--accent)}
.movie-card p{font-size:12px;color:var(--muted);margin-top:5px}

/* ====================== 电影库筛选 / 分页 ====================== */
.filter-bar{display:flex;align-items:end;gap:16px;padding:22px;border-radius:16px}
.filter-bar label{display:block;font-size:12px;color:var(--muted);margin-bottom:9px}
.search-field{flex:1}.genre-field{width:220px}
.result-caption{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:24px 0}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:30px;font-size:12px}
.pagination .pg{display:inline-flex;gap:6px}
.pagination button{min-width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:.2s}
.pagination button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination button.cur{background:var(--accent);color:#fff;border-color:transparent}

/* ====================== 详情页 ====================== */
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:34px;min-height:44px;font-size:13px}
.back-link:hover{color:var(--accent)}
.detail-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:56px}
.detail-layout aside .movie-poster{aspect-ratio:2/3}
.archive-id{font-size:10px;color:var(--muted);letter-spacing:.15em;margin-top:16px}
.detail-content h1{font-size:clamp(30px,3vw,46px);line-height:1.35;overflow-wrap:anywhere}
.original-title{color:var(--muted);margin-top:8px}
.genre-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.genre-tags .tag{font-size:12px;padding:5px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.film-facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;padding:24px 0;border-block:1px solid var(--border);margin:26px 0}
.film-facts>div{display:flex;gap:20px}
.film-facts dt{color:var(--muted);font-size:12px;min-width:60px}
.film-facts dd{margin:0;font-size:13px}
.film-facts .wide{grid-column:1/-1}
.synopsis h2{font-size:19px;margin-bottom:16px}
.synopsis p{color:var(--muted);font-size:14px;line-height:1.95}
.rating-panel{margin-top:32px}
.rating-panel form,.inline-empty{padding:24px}
.rating-panel form>label{display:block;font-size:13px;margin-bottom:14px}
.rating-panel form strong{color:var(--accent);margin-left:10px}
.rating-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.num-input{width:160px;height:46px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:0 14px;font-size:15px}
.form-hint{font-size:12px;color:var(--muted);line-height:1.8;margin-top:14px}
.inline-empty{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;transition:.2s}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-color:transparent;box-shadow:0 12px 30px -14px rgba(225,29,42,.8)}
.btn.primary:hover{transform:translateY(-2px)}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ic{font-size:15px}

/* ====================== 推荐实验室 ====================== */
.lab-notice{display:flex;align-items:center;gap:16px;padding:16px 22px;background:var(--accent-tint);border:1px solid rgba(225,29,42,.3);border-radius:12px;margin-bottom:28px}
.lab-notice p{font-size:13px;color:var(--muted)}
.lab-notice .status-pill{white-space:nowrap}
.lab-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:28px;align-items:start}
.lab-controls{padding:24px;border:1px solid var(--glass-brd);background:var(--glass);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 24px 60px -34px rgba(0,0,0,.85)}
.lab-controls h2{font-size:20px;margin-bottom:24px}
.lab-controls>label{display:block;color:var(--muted);font-size:12px;margin:24px 0 9px}

  const loginLink = (!endpoint && emptySubject==='登录后体验') ? `<a class="text-link" href="#/login">前往登录 →</a>` : '';

    <div class="algorithm-empty" role="status"><div class="algorithm-symbol">${I.conn}</div><div>${empty}</div>${loginLink}</div>

function renderMoviesGrid(q='',genre='',page=1){
  let list = MOVIES.filter(m=>(!q||(title(m)+m.movielens_title).toLowerCase().includes(q.toLowerCase()))&&(!genre||(m.genres||[]).includes(genre)));
  document.getElementById('total-cap').textContent = `${list.length.toLocaleString()} 部电影`;
  const per=12, total=Math.max(1,Math.ceil(list.length/per)), p=Math.min(page,total);
  const slice=list.slice((p-1)*per,p*per);
  document.getElementById('movies-grid').innerHTML = slice.length?slice.map(movieCard).join(''):`<div class="state-panel"><p>没有找到匹配的电影</p></div>`;
  const pg=document.getElementById('movies-pager');
  if(list.length>per){
    pg.innerHTML=`<div class="pagination"><span class="muted">共 ${list.length.toLocaleString()} 条</span><span class="pg">${Array.from({length:total},(_,i)=>`<button class="${i+1===p?'cur':''}" data-p="${i+1}">${i+1}</button>`).join('')}</span></div>`;
    pg.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>renderMoviesGrid(q,genre,+b.dataset.p));
  }else pg.innerHTML='';
  revealObserve();
}

/* ====================== 路由 ====================== */
function render(){
  accountNav();
  const hash=location.hash||'#/';
  const view=document.getElementById('view');
  document.querySelectorAll('.sidebar nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===(hash==='#/'?'/':hash.split('/').slice(0,2).join('/'))));
  let html;
  if(hash==='#/'||hash===''||hash==='#') html=viewHome();
  else if(hash==='#/movies') html=viewMovies();
  else if(hash.startsWith('#/movies/')) html=viewDetail(hash.split('/')[2]);
  else if(hash==='#/experiments') html=viewExperiments();
  else if(hash==='#/login') html=viewAuth('login');
  else if(hash==='#/register') html=viewAuth('register');
  else if(hash==='#/profile') html=viewProfile();
  else html=view404();
  view.innerHTML=html;
  window.scrollTo({top:0});
  attach();
  revealObserve();
}

/* ====================== 交互绑定 ====================== */
function attach(){
  const hash=location.hash||'#/';
  if(hash==='#/movies'){
    renderMoviesGrid();
    document.getElementById('filter-form').onsubmit=e=>{e.preventDefault();renderMoviesGrid(document.getElementById('movie-search').value,document.getElementById('genre-select').value);};
  }
  if(hash.startsWith('#/movies/')){
    const f=document.getElementById('rate-form');
    if(f){
      f.onsubmit=e=>{e.preventDefault();const v=document.getElementById('rating-input').value;if(!v){alert('请先输入评分');return;}document.getElementById('saved-score').textContent=v;document.getElementById('save-rate').textContent='修改评分';alert('评分已保存（原型演示）');};
      document.getElementById('fav-btn').onclick=()=>alert('已加入收藏（原型演示）');
    }
  }
  if(hash==='#/experiments'){
    const src=document.getElementById('subject-source');
    const upd=()=>{const ml=src.value==='ml';document.getElementById('ml-box').style.display=ml?'':'none';document.getElementById('app-box').style.display=ml?'none':'';document.getElementById('cur-subject').textContent=ml?('ml:'+document.getElementById('history-user').value):(state.loggedIn?state.account.subject_key:'未选择');document.getElementById('hist-subject').textContent=(ml?('ml:'+document.getElementById('history-user').value):(state.loggedIn?state.account.subject_key:'未选择'))+' · 只读';};
    src.onchange=upd;document.getElementById('history-user').onchange=upd;upd();
  }
  if(hash==='#/login'||hash==='#/register'){
    document.getElementById('auth-form').onsubmit=e=>{e.preventDefault();if(!document.getElementById('login_name').value||!document.getElementById('password').value){alert('请输入登录名与密码');return;}state.loggedIn=true;state.account={login_name:document.getElementById('login_name').value||'demo_user',subject_key:'app:'+(document.getElementById('login_name').value||'demo_user')};alert('登录成功（原型演示）');location.hash='#/profile';};
  }
}

/* ====================== 入场淡入 ====================== */
let io;
function revealObserve(){
  if(!io) io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el));
}
addEventListener('hashchange',render);
render();
</script>
